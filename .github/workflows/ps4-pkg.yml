name: Build PS4 PKG (phone friendly)
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish experimental release after a successful build (requires explicit opt-in)'
        type: boolean
        default: false
  pull_request:
permissions:
  contents: write
jobs:
  pkg:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install compilation and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl libicu-dev python3
      - name: Download pinned OpenOrbis v0.5.4 toolchain
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o "$RUNNER_TEMP/openorbis.tar.gz"
          mkdir -p "$RUNNER_TEMP/oo"
          tar -xzf "$RUNNER_TEMP/openorbis.tar.gz" -C "$RUNNER_TEMP/oo"
          sdk="$(dirname "$(find "$RUNNER_TEMP/oo" -name link.x -type f -print -quit)")"
          test -n "$sdk" && test -f "$sdk/link.x"
          echo "OO_PS4_TOOLCHAIN=$sdk" >> "$GITHUB_ENV"
          chmod +x "$sdk"/bin/linux/* || true
          echo "OpenOrbis toolchain found: $sdk"
      - name: Fetch pinned JSON header
        run: python3 scripts/fetch-deps.py
      - name: Build native PS4 application and PKG
        run: |
          make -f Makefile.ps4 preflight
          make -f Makefile.ps4 -j2
      - name: Validate output before artifact upload
        run: |
          set -e
          python3 -c 'from pathlib import Path; p=Path("sce_sys/icon0.png").read_bytes(); assert p[:8] == bytes.fromhex("89504e470d0a1a0a") and int.from_bytes(p[16:20],"big")==512 and int.from_bytes(p[20:24],"big")==512 and p[24:26]==bytes([8,2]), "PS4 icon must be opaque 512x512 24-bit RGB PNG"'
          test -s IV0000-BREW00001_00-PS4DOWNLOADMGR00.pkg
          python3 scripts/check_pkg.py IV0000-BREW00001_00-PS4DOWNLOADMGR00.pkg --expected-id IV0000-BREW00001_00-PS4DOWNLOADMGR00 --sha256
          sha256sum IV0000-BREW00001_00-PS4DOWNLOADMGR00.pkg > IV0000-BREW00001_00-PS4DOWNLOADMGR00.pkg.sha256
      - name: Upload phone-downloadable PKG
        uses: actions/upload-artifact@v4
        with:
          name: PS4DownloadManager-GoldHEN
          path: |
            IV0000-BREW00001_00-PS4DOWNLOADMGR00.pkg
            IV0000-BREW00001_00-PS4DOWNLOADMGR00.pkg.sha256
            eboot.bin
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct-download GitHub prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.1.1-ps4-build-${{ github.run_number }}"
          gh release create "$tag" \
            IV0000-BREW00001_00-PS4DOWNLOADMGR00.pkg \
            IV0000-BREW00001_00-PS4DOWNLOADMGR00.pkg.sha256 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "PS4 Download Manager 0.1.1 (experimental build ${{ github.run_number }})" \
            --notes "Experimental PS4 GoldHEN package built with OpenOrbis. Native compilation and PKG header verification passed. Installation and runtime behavior on real hardware remain unverified. Download the .pkg asset directly on your phone, FTP it to /data/pkg/, then install using GoldHEN Package Installer." \
            --prerelease
